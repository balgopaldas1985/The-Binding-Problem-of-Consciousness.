<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURO-BINDING // Unsolved Consciousness Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            color: #38bdf8;
        }

        #webgl-canvas {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(16px);
            padding: 20px;
            border-radius: 14px;
            width: 340px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 1.05rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #fff;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        select, input[type="range"] {
            width: 100%;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            padding: 8px;
            outline: none;
            font-size: 0.85rem;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 6px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .info-card {
            font-size: 0.8rem;
            line-height: 1.45;
            color: #cbd5e1;
            background: rgba(0, 0, 0, 0.45);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #38bdf8;
            margin-top: 12px;
        }
    </style>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="hud-panel">
        <h1>🧠 BINDING PROBLEM MODEL</h1>

        <div class="control-group">
            <label for="syncRate">Gamma Phase Lock ($\gamma$-Frequency):</label>
            <input type="range" id="syncRate" min="0.1" max="4.0" step="0.1" value="1.5">
        </div>

        <div class="control-group">
            <label for="topologyMode">Perceptual Topology Shift:</label>
            <select id="topologyMode">
                <option value="torus">Toroidal Consciousness Manifold</option>
                <option value="mobius">Non-Orientable Mind Structure</option>
                <option value="network">Dynamic Neural Lattice</option>
            </select>
        </div>

        <button class="btn" onclick="triggerPerceptualBinding()">COLLAPSE UNIFIED PERCEPT</button>

        <div class="info-card" id="infoText">
            <strong>Unsolved Mystery:</strong> How thousands of disconnected sensory firings lock into 40Hz gamma synchronization to form a single moment of unified conscious experience.
        </div>
    </div>

    <script>
        // --- 1. THREE.JS SCENE SETUP ---
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. LIGHTING & AMBIENCE ---
        const ambientLight = new THREE.AmbientLight(0x0f172a, 1.0);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x38bdf8, 3, 25);
        scene.add(pointLight);

        // --- 3. SYNCHRONOUS NEURAL FIELD GEOMETRY ---
        const particleCount = 3000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const phases = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            let u = Math.random() * Math.PI * 2;
            let v = (Math.random() - 0.5) * Math.PI;
            let r = 3.5 + Math.random() * 0.5;

            positions[i * 3] = r * Math.cos(v) * Math.cos(u);
            positions[i * 3 + 1] = r * Math.cos(v) * Math.sin(u);
            positions[i * 3 + 2] = r * Math.sin(v);

            phases[i] = Math.random() * Math.PI * 2;

            colors[i * 3] = 0.2;
            colors[i * 3 + 1] = 0.6;
            colors[i * 3 + 2] = 1.0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.16,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const brainMesh = new THREE.Points(geometry, material);
        scene.add(brainMesh);

        // --- 4. BINDING SYNCHRONIZATION LOGIC ---
        let burstEnergy = 0;

        function triggerPerceptualBinding() {
            burstEnergy = 3.0;
            // Instantly synchronize phases (Kuramoto Model transition)
            for (let i = 0; i < particleCount; i++) {
                phases[i] = 0;
            }
        }

        // --- 5. ANIMATION & SYNCHRONY LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const gammaFreq = parseFloat(document.getElementById('syncRate').value);
            const mode = document.getElementById('topologyMode').value;

            const posAttr = geometry.attributes.position;
            const colAttr = geometry.attributes.color;

            for (let i = 0; i < particleCount; i++) {
                phases[i] += 0.02 * gammaFreq;
                let p = phases[i];

                let x = posAttr.getX(i);
                let y = posAttr.getY(i);
                let z = posAttr.getZ(i);

                if (mode === 'torus') {
                    let theta = (i / particleCount) * Math.PI * 2;
                    let R = 3.5, r = 1.2;
                    x = (R + r * Math.cos(theta * 6 + elapsedTime)) * Math.cos(theta);
                    y = (R + r * Math.cos(theta * 6 + elapsedTime)) * Math.sin(theta);
                    z = r * Math.sin(theta * 6 + elapsedTime);
                }

                posAttr.setXYZ(i, x, y, z);

                // Color shifts when neurons lock phase (Binding moment)
                let syncVal = Math.sin(p + elapsedTime * 2);
                colAttr.setXYZ(
                    i,
                    Math.abs(Math.sin(p)) * 0.8 + burstEnergy * 0.2,
                    Math.abs(Math.cos(p)) * 0.7,
                    Math.abs(Math.sin(p * 0.5))
                );
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            brainMesh.rotation.y = elapsedTime * 0.1;
            brainMesh.rotation.x = Math.sin(elapsedTime * 0.05) * 0.15;

            if (burstEnergy > 0) burstEnergy -= 0.04;
            pointLight.intensity = 2.0 + Math.sin(elapsedTime * gammaFreq * 4.0) * 1.5 + burstEnergy;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
              </html>
